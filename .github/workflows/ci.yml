name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
# Only the newest revision of a feature branch needs the full Chromium/WebKit
# suite. Push and PR runs share one group to avoid redundant overlapping jobs.
concurrency:
  group: ashen-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: node scripts/check-pages-build.mjs
      - run: node scripts/check-version-manifest.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
