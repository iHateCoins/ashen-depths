name: CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
# Cancel superseded revisions but retain the latest PR checks.
concurrency:
  group: ashen-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: node scripts/check-pages-build.mjs
      - run: node scripts/check-version-manifest.mjs

  browser:
    name: E2E / ${{ matrix.project }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-landscape, iphone-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Install browser dependencies
        run: npx playwright install --with-deps ${{ matrix.project == 'iphone-safari' && 'webkit' || 'chromium' }}
      - name: Run ${{ matrix.project }} tests (isolated worker)
        run: npx playwright test --project=${{ matrix.project }} --workers=1
      - name: Preserve failed test screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
